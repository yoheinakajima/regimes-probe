# regimes-probe default configuration.
# Everything here runs with NO API keys and NO network (synthetic + fake tools).
# Live settings are documented but inert until the relevant provider keys exist.

run:
  run_id_prefix: "regimes-probe"
  results_root: "results"
  as_of: "2026-06-01"            # frozen "today" for freshness scoring / replay

dataset:
  primary: "LiveBrowseComp"       # benchmark_primary
  secondary: "BrowseComp"         # benchmark_secondary
  default: "synthetic"            # what the no-key quickstart uses
  synthetic_path: "fixtures/synthetic_browse.json"
  fake_corpus_path: "fixtures/fake_search_corpus.json"
  # Real datasets (leave blank for the no-key path; see docs/NEXT_LIVE_RUN.md):
  browsecomp_csv: ""              # path to the downloaded BrowseComp obfuscated CSV
  livebrowsecomp_hf: "Forival/LiveBrowseComp"   # HF dataset id (needs network)
  livebrowsecomp_local_jsonl: ""  # offline JSONL cache (alternative to HF)

split:
  confirm_fraction: 0.4
  salt: "regimes-probe-v0"
  mode: "hash"                    # hash | time (time recommended for LiveBrowseComp)

budgets: [1, 3, 5, 10]           # tool-call budget tracks
main_metric: "correct_per_tool_call"

memory:
  optimize_allows_exploration: true
  confirm_uses_frozen_snapshot: true
  confirm_updates_memory: false
  experience_passes: 4
  experience_budget: 5
  nearest_k: 8

bandit:
  strategy: "ucb"                 # ucb | epsilon_greedy | thompson
  exploration_coeff: 0.6
  recency_decay: 0.98
  confidence_penalty: 0.1
  blend_local: 1.0
  blend_global: 0.4
  blend_neighbor: 0.7
  seed: 1729

policy:
  query_mode: "learned"           # fixed | llm | learned
  stop_mode: "learned"            # always_full | first_candidate | learned

router:
  cost_weight: 0.5

stopping:
  stop_threshold: 0.6
  min_calls_before_stop: 1

verification:
  authority_threshold: 0.7
  freshness_required_when_sensitive: true
  min_support: 1

reward:
  preset: "full"                  # full | correctness_only | correctness_minus_cost | correctness_plus_evidence
  weights:
    correctness: 1.0
    evidence_quality: 0.3
    source_authority: 0.2
    freshness: 0.2
    first_tool_hit: 0.5
    cost_penalty: 2.0
    latency_penalty: 0.0
    stale_penalty: 0.4
    contradiction_penalty: 0.3
    extra_call_penalty: 0.2

regimes_loop:
  enabled: false
  passes: 4
  gate_budget: 3
  optimize_min_delta: 0.01
  confirm_max_regression: 0.0

# Ablation scaffolding (all no-key runnable on the synthetic fixture). Each entry
# overrides parts of the config above; run with scripts/run_ablations.py.
ablations:
  routing_only:                       # Level 1 only
    policy: {query_mode: fixed, stop_mode: always_full}
  routing_plus_query_policy:
    policy: {query_mode: learned, stop_mode: always_full}
  routing_plus_query_plus_stop_verify:   # full Level 2
    policy: {query_mode: learned, stop_mode: learned}
  correctness_only_reward:
    reward: {preset: correctness_only}
  full_epistemic_reward:
    reward: {preset: full}
  frozen_memory_confirm:              # headline path
    memory: {confirm_updates_memory: false}
  online_learning_confirm:            # NON-headline; CONFIRM keeps learning
    memory: {confirm_updates_memory: true}
    _online_confirm: true
    _non_headline: true

# Live model/search settings (inert without keys). See MODEL_AND_TOOL_CHOICES.md.
# CHEAP-FIRST by default: OpenAI hosted web_search is OPT-IN, not the center of
# the experiment. The main experiment is provider-diverse tool routing.
live:
  answer_model: "gpt-5.4-mini"          # cheap-first default answerer
  strong_answer_model: "gpt-5.5"        # expensive baseline option ONLY (opt-in)
  web_search_model: "gpt-5.4-mini"      # model for the OpenAI web_search tool (if used)
  web_search_context_size: "low"        # low | medium | high | unlimited
  search_provider_mode: "cheap"         # cheap | diverse | openai-hosted
  embedder: "hash_embedder"             # or "openai_embedder" for live runs
  search_baseline: "openai_web_search"  # hosted baseline adapter NAME (opt-in only)
  # Tools considered for cheap/diverse modes (each is a separate bandit arm).
  # openai_web_search is deliberately absent here; add it via --tools or
  # --search-provider-mode openai-hosted.
  tools_enabled:
    - "page_fetch"
    - "serper_search"
    - "brave_search"
    - "tavily_search"
    - "exa_search"
