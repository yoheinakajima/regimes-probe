# regimes-probe default configuration.
# Everything here runs with NO API keys and NO network (synthetic + fake tools).
# Live settings are documented but inert until the relevant provider keys exist.

run:
  run_id_prefix: "regimes-probe"
  results_root: "results"
  as_of: "2026-06-01"            # frozen "today" for freshness scoring / replay

dataset:
  primary: "LiveBrowseComp"       # benchmark_primary
  secondary: "BrowseComp"         # benchmark_secondary
  default: "synthetic"            # what the no-key quickstart uses
  synthetic_path: "fixtures/synthetic_browse.json"
  fake_corpus_path: "fixtures/fake_search_corpus.json"
  # Real datasets (leave blank for the no-key path; see docs/NEXT_LIVE_RUN.md):
  browsecomp_csv: ""              # path to the downloaded BrowseComp obfuscated CSV
  livebrowsecomp_hf: "Forival/LiveBrowseComp"   # HF dataset id (needs network)
  livebrowsecomp_local_jsonl: ""  # offline JSONL cache (alternative to HF)

split:
  confirm_fraction: 0.4
  salt: "regimes-probe-v0"
  mode: "hash"                    # hash | time (time recommended for LiveBrowseComp)

budgets: [1, 3, 5, 10]           # tool-call budget tracks
main_metric: "correct_per_tool_call"

# Headline (memory-learning claim) eligibility gates. A run is eligible for the
# main memory headline only if it runs ALL of closed_book/no_memory_search/
# random_memory/policy_memory on a real dataset with a CONFIRM set this large.
headline:
  min_confirm_size: 20
  # A few recorded provider failures are fine (still structurally valid), but a
  # run is NOT headline-eligible if the provider failure rate exceeds this, or if
  # any required condition fails entirely.
  max_provider_failure_rate: 0.2

memory:
  optimize_allows_exploration: true
  confirm_uses_frozen_snapshot: true
  confirm_updates_memory: false
  experience_passes: 4
  experience_budget: 5
  nearest_k: 8

bandit:
  strategy: "ucb"                 # ucb | epsilon_greedy | thompson
  exploration_coeff: 0.6
  recency_decay: 0.98
  confidence_penalty: 0.1
  blend_local: 1.0
  blend_global: 0.4
  blend_neighbor: 0.7
  seed: 1729

policy:
  query_mode: "learned"           # fixed | llm | learned
  stop_mode: "learned"            # always_full | first_candidate | learned
  # Level 2 query decomposition: emit several targeted clue queries per item and
  # let the bandit choose the query form (tool x query_arm). Off by default;
  # enable with --enable-query-decomposition. See docs/QUERY_POLICY.md.
  enable_query_decomposition: false
  # Iterative clue resolution: staged search that chases intermediate entities
  # found in earlier results. Off by default; --enable-iterative-clue-resolution.
  enable_iterative_clue_resolution: false
  # Level 4 task frame: constraint-graph / hypothesis-table policy that represents
  # target/latent slots + constraints and plans actions to resolve them. Off by
  # default; --enable-task-frame.
  enable_task_frame: false
  # Optional cached/validated LLM task-frame parser (Level 4). Requires
  # enable_task_frame. Emits the same TaskFrame schema, is schema-validated, and
  # falls back to the deterministic parser when invalid/low-quality. Off by
  # default; --enable-llm-task-frame-parser.
  enable_llm_task_frame_parser: false
  # Epistemic escalation controller: pick the cheapest mode (direct_answer /
  # simple_lookup / decomposed_search / iterative_research / task_frame_required)
  # per question instead of always running the heavy parser. Off by default (the
  # benchmark uses explicit flags); generic agent mode uses --auto-epistemic-mode.
  auto_epistemic_mode: false
  force_task_frame: false        # always escalate to task-frame mode
  disable_direct_answer: false   # never use the direct-answer mode
  # Frontier controller (Level 5): when on, the candidate-slate FrontierScheduler
  # drives tool/action selection (each call links to a frontier_action id, with
  # fallback to the old planner per step). Requires enable_task_frame. Default off
  # => shadow mode (frontier records recommendations only). --enable-frontier-controller.
  enable_frontier_controller: false
  # LLM frontier proposer (Level 5c): a bounded LLM proposes constraint-grounded
  # research actions from an ActiveGraph state card; deterministic code validates,
  # scores, executes, records. Both require enable_task_frame. repair = call only
  # when the deterministic query is generic; planner = ask for top-K proposals.
  # Off by default; cache/replay-safe. --enable-llm-frontier-repair / -planner.
  enable_llm_frontier_repair: false
  enable_llm_frontier_planner: false
  # Level 5d: the deterministic evidence interpreter is ALWAYS on (slates are populated
  # from structured assertions, not raw n-grams). This flag only adds an optional
  # cached/replayable LLM source-role re-classification. --enable-llm-evidence-interpreter.
  enable_llm_evidence_interpreter: false
  # Level 5f: optional cached/replayable LLM evidence JUDGE — decides whether a source
  # excerpt supports/partially-supports/contradicts a candidate/slot/constraint triple.
  # Deterministic recognizer is the fallback. --enable-llm-evidence-judge.
  enable_llm_evidence_judge: false
  # Level 3 evidence reading: if firecrawl_scrape fails (e.g. 402/quota), fall
  # back to the basic page_fetch on the same URL. Social pages are not scraped
  # unless allow_social_scrape is set.
  scrape_fallback_to_page_fetch: true
  allow_social_scrape: false

router:
  cost_weight: 0.5

stopping:
  stop_threshold: 0.6
  min_calls_before_stop: 1

verification:
  authority_threshold: 0.7
  freshness_required_when_sensitive: true
  min_support: 1

reward:
  preset: "full"                  # full | correctness_only | correctness_minus_cost | correctness_plus_evidence
  weights:
    correctness: 1.0
    evidence_quality: 0.3
    source_authority: 0.2
    freshness: 0.2
    first_tool_hit: 0.5
    cost_penalty: 2.0
    latency_penalty: 0.0
    stale_penalty: 0.4
    contradiction_penalty: 0.3
    extra_call_penalty: 0.2

regimes_loop:
  enabled: false
  passes: 4
  gate_budget: 3
  optimize_min_delta: 0.01
  confirm_max_regression: 0.0

# Ablation scaffolding (all no-key runnable on the synthetic fixture). Each entry
# overrides parts of the config above; run with scripts/run_ablations.py.
ablations:
  routing_only:                       # Level 1 only
    policy: {query_mode: fixed, stop_mode: always_full}
  routing_plus_query_policy:
    policy: {query_mode: learned, stop_mode: always_full}
  routing_plus_query_plus_stop_verify:   # full Level 2
    policy: {query_mode: learned, stop_mode: learned}
  correctness_only_reward:
    reward: {preset: correctness_only}
  full_epistemic_reward:
    reward: {preset: full}
  frozen_memory_confirm:              # headline path
    memory: {confirm_updates_memory: false}
  online_learning_confirm:            # NON-headline; CONFIRM keeps learning
    memory: {confirm_updates_memory: true}
    _online_confirm: true
    _non_headline: true

# Live model/search settings (inert without keys). See MODEL_AND_TOOL_CHOICES.md.
# CHEAP-FIRST by default: OpenAI hosted web_search is OPT-IN, not the center of
# the experiment. The main experiment is provider-diverse tool routing.
live:
  answer_model: "gpt-5.4-mini"          # cheap-first default answerer
  strong_answer_model: "gpt-5.5"        # expensive baseline option ONLY (opt-in)
  web_search_model: "gpt-5.4-mini"      # model for the OpenAI web_search tool (if used)
  web_search_context_size: "low"        # low | medium | high | unlimited
  search_provider_mode: "cheap"         # cheap | diverse | openai-hosted
  embedder: "hash_embedder"             # or "openai_embedder" for live runs
  search_baseline: "openai_web_search"  # hosted baseline adapter NAME (opt-in only)
  # Tools considered for cheap/diverse modes (each is a separate bandit arm).
  # openai_web_search is deliberately absent here; add it via --tools or
  # --search-provider-mode openai-hosted. Agentic-discovery (Monid), scrape
  # (firecrawl_scrape), browser-like (firecrawl_interact) and stateful/paid
  # (monid_run) tools are OFF unless their explicit flags are set; browser-use is
  # DEFERRED. See docs/TOOL_ABSTRACTIONS.md.
  tools_enabled:
    - "page_fetch"
    - "serper_search"
    - "brave_search"
    - "tavily_search"
    - "exa_search"
    - "firecrawl_search"          # search; cheap/diverse-eligible with FIRECRAWL_API_KEY
  # Optional providers (opt-in via CLI flags; never auto in cheap mode):
  #   monid_discover/monid_inspect  --enable-agentic-tool-discovery (auto in diverse)
  #   firecrawl_scrape              --enable-scrape-tools
  #   firecrawl_interact           --enable-browserish-tools
  #   monid_run                    --allow-stateful-or-paid-tools
  #   wokelo_research/company_lookup  need WOKELO_BASE_URL + endpoint path (fail closed)
  # Env vars (optional; documented in config/tools.example.yaml):
  #   FIRECRAWL_API_KEY, MONID_API_KEY, WOKELO_API_KEY, WOKELO_BASE_URL,
  #   WOKELO_RESEARCH_PATH, WOKELO_COMPANY_PATH, WOKELO_OPENAPI_PATH
