[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regimes-probe"
version = "0.1.0"
description = "ActiveGraph-native benchmark and improvement loop for learning epistemic search policy from traces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "regimes-probe authors" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# ActiveGraph runtime. Optional so the pure-Python policy/eval layer and the
# unit-test suite import and run without it; the activegraph_pack integration
# and replay checks require it.
activegraph = ["activegraph>=1.0.5"]
# Live providers. Each is optional and gated behind an env var at runtime.
openai = ["openai>=1.40"]
datasets = ["datasets>=2.19", "huggingface_hub>=0.23"]
numpy = ["numpy>=1.26"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
